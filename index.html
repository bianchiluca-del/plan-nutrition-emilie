<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Alimentaire — Émilie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --pink:    #e91e8c;
  --pink-l:  #fce4ec;
  --pink-d:  #ad1457;
  --bg:      #fdf7fa;
  --card:    #ffffff;
  --border:  #f0dde8;
  --text:    #2d1a2e;
  --muted:   #9e7a8e;
  --ok:      #2e7d32;
  --ko:      #c62828;
  --radius:  14px;
  --shadow:  0 2px 12px rgba(233,30,140,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── HEADER ── */
header {
  background: linear-gradient(135deg, var(--pink-d), var(--pink));
  color: #fff; padding: 18px 20px 0;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 16px rgba(233,30,140,.25);
}
header h1 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.25rem; letter-spacing: -.3px; }
header p  { font-size: .75rem; opacity: .8; margin-top: 2px; }
nav { display: flex; gap: 2px; margin-top: 14px; }
nav button {
  flex: 1; background: transparent; border: none; color: rgba(255,255,255,.7);
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .82rem;
  padding: 10px 4px; cursor: pointer; border-radius: 10px 10px 0 0;
  transition: all .2s; letter-spacing: .2px;
}
nav button.active { background: var(--bg); color: var(--pink-d); }
nav button:hover:not(.active) { background: rgba(255,255,255,.15); color: #fff; }

/* ── LAYOUT ── */
main { max-width: 680px; margin: 0 auto; padding: 18px 14px 80px; }
section { display: none; }
section.active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-title {
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .9rem;
  color: var(--pink-d); margin-bottom: 10px; display: flex;
  align-items: center; gap: 7px;
}

/* ── PLAN SELECTOR ── */
.plan-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.plan-btn {
  background: var(--card); border: 2px solid var(--border);
  border-radius: 20px; padding: 7px 14px; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .8rem;
  color: var(--muted); transition: all .2s;
}
.plan-btn.active, .plan-btn:hover {
  border-color: var(--pink); color: var(--pink-d);
  background: var(--pink-l);
}

/* ── MEAL CARD ── */
.meal-card {
  border-radius: var(--radius); margin-bottom: 12px;
  overflow: hidden; border: 1.5px solid;
}
.meal-header {
  padding: 11px 14px; display: flex; justify-content: space-between;
  align-items: center; font-family: 'Nunito', sans-serif; font-weight: 800;
}
.meal-header .meal-name { font-size: .9rem; }
.meal-header .meal-time { font-size: .75rem; opacity: .75; }
.meal-macros-bar {
  padding: 6px 14px; font-size: .72rem; font-weight: 600;
  display: flex; gap: 14px; flex-wrap: wrap; border-top: 1px solid rgba(0,0,0,.06);
}
.meal-items { padding: 10px 14px; background: #fff; }
.item-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 0; border-bottom: 1px solid #f5ecf0; font-size: .82rem;
}
.item-row:last-child { border-bottom: none; }
.item-name { font-weight: 600; }
.item-qty  { color: var(--muted); font-size: .78rem; }
.item-cal  { font-weight: 700; color: var(--pink-d); font-size: .78rem; }
.tag-suppl { background: #f3e5f5; color: #7b1fa2; border-radius: 8px; padding: 2px 7px; font-size: .7rem; font-weight: 700; }
.subgroup-title { font-size: .72rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 8px 0 4px; }

/* ── SUIVI ── */
.date-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.date-nav button {
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 8px; width: 36px; height: 36px; cursor: pointer;
  font-size: 1rem; color: var(--pink-d); font-weight: 700;
}
.date-nav input[type=date] {
  flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 7px 10px; font-family: 'Nunito Sans', sans-serif;
  font-size: .9rem; color: var(--text); background: var(--card);
}
.toggle-row { display: flex; gap: 8px; margin-bottom: 10px; }
.toggle-btn {
  flex: 1; padding: 10px; border-radius: 10px; border: 2px solid var(--border);
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .82rem;
  cursor: pointer; background: var(--card); color: var(--muted); transition: all .2s;
}
.toggle-btn.ok { background: #e8f5e9; border-color: var(--ok); color: var(--ok); }
.toggle-btn.ko { background: #ffebee; border-color: var(--ko); color: var(--ko); }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-weight: 700; font-size: .8rem; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
.form-row input, .form-row textarea {
  width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 9px 12px; font-family: 'Nunito Sans', sans-serif; font-size: .9rem;
  color: var(--text); background: var(--card); transition: border .2s;
}
.form-row input:focus, .form-row textarea:focus { outline: none; border-color: var(--pink); }
.form-row textarea { resize: vertical; min-height: 60px; }
.btn-save {
  width: 100%; padding: 13px; background: linear-gradient(135deg, var(--pink-d), var(--pink));
  color: #fff; border: none; border-radius: 10px; font-family: 'Nunito', sans-serif;
  font-weight: 800; font-size: .95rem; cursor: pointer; transition: opacity .2s;
  letter-spacing: .3px;
}
.btn-save:hover { opacity: .9; }
.btn-save:disabled { opacity: .5; cursor: default; }

/* ── CALENDAR ── */
.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-header button { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--pink-d); font-weight: 700; }
.cal-header span { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .95rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-day-label { text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); padding: 4px 0; text-transform: uppercase; }
.cal-day {
  aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: .78rem; font-weight: 700; cursor: pointer;
  transition: all .15s; position: relative;
}
.cal-day.empty { background: transparent; cursor: default; }
.cal-day.today { box-shadow: 0 0 0 2px var(--pink); }
.cal-day.has-data.ok-ok { background: #c8e6c9; color: var(--ok); }
.cal-day.has-data.ok-ko, .cal-day.has-data.ko-ok { background: #fff9c4; color: #f57f17; }
.cal-day.has-data.ko-ko { background: #ffcdd2; color: var(--ko); }
.cal-day:not(.empty):not(.has-data) { background: #f5ecf0; color: var(--muted); }
.cal-day.selected { box-shadow: 0 0 0 2px var(--pink-d) !important; }

/* ── MENSURATIONS ── */
.mens-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mens-field label { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
.mens-field input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-family: 'Nunito Sans', sans-serif; font-size: .88rem;
  color: var(--text); background: var(--card); transition: border .2s;
}
.mens-field input:focus { outline: none; border-color: var(--pink); }
.mens-table { width: 100%; border-collapse: collapse; font-size: .78rem; overflow-x: auto; display: block; }
.mens-table th { background: var(--pink-l); color: var(--pink-d); font-weight: 800; padding: 7px 8px; text-align: left; white-space: nowrap; }
.mens-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.mens-table tr:last-child td { border-bottom: none; }
.btn-del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 1rem; transition: color .15s; padding: 2px 5px; }
.btn-del:hover { color: var(--ko); }

/* ── STATS ── */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat-box { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 10px; text-align: center; }
.stat-val { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--pink-d); }
.stat-lbl { font-size: .7rem; color: var(--muted); font-weight: 600; margin-top: 2px; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--pink-d); color: #fff; padding: 10px 22px; border-radius: 20px;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .85rem;
  opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🌸 Plan Alimentaire — Émilie</h1>
  <p id="header-date"></p>
  <nav>
    <button class="active" onclick="switchTab('plan',this)">🥗 Plans</button>
    <button onclick="switchTab('suivi',this)">📅 Suivi</button>
    <button onclick="switchTab('mensurations',this)">📏 Mesures</button>
  </nav>
</header>

<main>

<!-- ═══════════════════ PLAN ═══════════════════ -->
<section id="tab-plan" class="active">
  <div class="plan-grid" id="plan-selector"></div>
  <div id="plan-content"><p style="color:var(--muted);text-align:center;padding:30px">Chargement des plans…</p></div>
</section>

<!-- ═══════════════════ SUIVI ═══════════════════ -->
<section id="tab-suivi">

  <div class="stats-row" id="stats-row">
    <div class="stat-box"><div class="stat-val" id="stat-ok">–</div><div class="stat-lbl">Jours ✅ ✅</div></div>
    <div class="stat-box"><div class="stat-val" id="stat-streak">–</div><div class="stat-lbl">Streak 🔥</div></div>
    <div class="stat-box"><div class="stat-val" id="stat-avg">–</div><div class="stat-lbl">Moy. kcal</div></div>
  </div>

  <div class="card">
    <div class="cal-header">
      <button onclick="calPrev()">‹</button>
      <span id="cal-title"></span>
      <button onclick="calNext()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="card">
    <div class="date-nav">
      <button onclick="changeDay(-1)">‹</button>
      <input type="date" id="suivi-date" onchange="loadDayForm()">
      <button onclick="changeDay(1)">›</button>
    </div>

    <div class="form-row">
      <label>Calories du jour</label>
      <input type="number" id="suivi-cal" placeholder="ex : 1850" min="0" max="5000">
    </div>

    <div class="form-row">
      <label>Alimentation</label>
      <div class="toggle-row">
        <button class="toggle-btn" id="btn-diet-ok" onclick="toggleDiet('ok')">✅ Respectée</button>
        <button class="toggle-btn" id="btn-diet-ko" onclick="toggleDiet('ko')">❌ Écart</button>
      </div>
    </div>

    <div class="form-row">
      <label>Entraînement</label>
      <div class="toggle-row">
        <button class="toggle-btn" id="btn-train-ok" onclick="toggleTrain('ok')">✅ Fait</button>
        <button class="toggle-btn" id="btn-train-ko" onclick="toggleTrain('ko')">❌ Repos</button>
      </div>
    </div>

    <div class="form-row">
      <label>Note alimentation</label>
      <textarea id="suivi-comment-diet" placeholder="Détails, écarts, ressentis…"></textarea>
    </div>

    <div class="form-row">
      <label>Note entraînement</label>
      <textarea id="suivi-comment-train" placeholder="Séance, intensité, commentaires…"></textarea>
    </div>

    <button class="btn-save" onclick="saveDay()">💾 Enregistrer</button>
  </div>

</section>

<!-- ═══════════════════ MENSURATIONS ═══════════════════ -->
<section id="tab-mensurations">

  <div class="card">
    <div class="card-title">📏 Nouvelle mesure</div>
    <div class="form-row">
      <label>Date</label>
      <input type="date" id="mens-date">
    </div>
    <div class="mens-grid">
      <div class="mens-field"><label>Poids (kg)</label><input type="number" id="m-poids" step="0.1" placeholder="58.5"></div>
      <div class="mens-field"><label>Poitrine (cm)</label><input type="number" id="m-poitrine" step="0.5" placeholder="92"></div>
      <div class="mens-field"><label>Taille (cm)</label><input type="number" id="m-taille" step="0.5" placeholder="68"></div>
      <div class="mens-field"><label>Nombril (cm)</label><input type="number" id="m-nombril" step="0.5" placeholder="70"></div>
      <div class="mens-field"><label>Fesses (cm)</label><input type="number" id="m-fesses" step="0.5" placeholder="93"></div>
      <div class="mens-field"><label>Cuisse D (cm)</label><input type="number" id="m-cuisseD" step="0.5" placeholder="52"></div>
      <div class="mens-field"><label>Cuisse G (cm)</label><input type="number" id="m-cuisseG" step="0.5" placeholder="52"></div>
      <div class="mens-field"><label>Genou D (cm)</label><input type="number" id="m-genouD" step="0.5" placeholder="35"></div>
      <div class="mens-field"><label>Genou G (cm)</label><input type="number" id="m-genouG" step="0.5" placeholder="35"></div>
    </div>
    <br>
    <button class="btn-save" onclick="saveMens()">💾 Enregistrer</button>
  </div>

  <div class="card">
    <div class="card-title">📊 Historique</div>
    <div style="overflow-x:auto">
      <table class="mens-table" id="mens-table">
        <thead><tr>
          <th>Date</th><th>Poids</th><th>Poitrine</th><th>Taille</th>
          <th>Nombril</th><th>Fesses</th><th>CuisseD</th><th>CuisseG</th>
          <th>GenouD</th><th>GenouG</th><th></th>
        </tr></thead>
        <tbody id="mens-body"></tbody>
      </table>
    </div>
  </div>

</section>

</main>
<div id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwMBrwud_ydIvfho4QVuaKo3HnAOroJ1C2b7jPG0esjmYAksnHX99uEDgpEutG6Ba7w/exec";

// ── STATE ──────────────────────────────────────────────────────────────────
let plans = {}, suivi = {}, mensurations = [];
let currentPlan = null;
let dietState = null, trainState = null;
let calYear, calMonth;

// ── UTILS ─────────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => n != null ? Number(n).toLocaleString('fr-FR') : '–';
const fmtDate = (s) => s ? new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'}) : '–';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function apiFetch(params) {
  const url = API + '?' + new URLSearchParams(params);
  const r = await fetch(url);
  return r.json();
}
async function apiPost(body) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
  return r.json();
}

// ── INIT ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  document.getElementById('suivi-date').value = today();
  document.getElementById('mens-date').value = today();
  document.getElementById('header-date').textContent =
    now.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

  const [p, s, m] = await Promise.all([
    apiFetch({action:'getPlans'}),
    apiFetch({action:'getSuivi'}),
    apiFetch({action:'getMensurations'})
  ]);
  plans = p; suivi = s; mensurations = Array.isArray(m) ? m : [];

  buildPlanSelector();
  renderCalendar();
  loadDayForm();
  renderMensurations();
  updateStats();
});

// ── TABS ─────────────────────────────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

// ═══════════════════ PLAN ════════════════════════════════════════════════
const PLAN_LABELS = {
  easyDayA:'Easy Day — Séré 🌿', easyDayB:'Easy Day — Oeufs 🥚',
  hardDayA:'Hard Day — Séré 💪', hardDayB:'Hard Day — Oeufs 🥚💪',
  carbLoading:'Carb Loading ⚡', postChir:'Post Chirurgie 🏥', cheatMeal:'Cheat Meal 🍕'
};

function buildPlanSelector() {
  const sel = document.getElementById('plan-selector');
  sel.innerHTML = '';
  Object.keys(plans).forEach(id => {
    const label = plans[id].label || PLAN_LABELS[id] || id;
    const btn = document.createElement('button');
    btn.className = 'plan-btn';
    btn.textContent = (plans[id].emoji || '') + ' ' + label;
    btn.onclick = () => selectPlan(id, btn);
    sel.appendChild(btn);
  });
  // Auto-select first
  const first = Object.keys(plans)[0];
  if (first) selectPlan(first, sel.querySelector('.plan-btn'));
}

function selectPlan(id, btn) {
  document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentPlan = id;
  renderPlan(id);
}

function calcMacros(items) {
  let cal=0, prot=0, gluc=0, lip=0;
  items.forEach(it => {
    if (it.supplement) return;
    const r = it.ref || 100;
    cal  += (it.qty / r) * it.cal;
    prot += (it.qty / r) * it.prot;
    gluc += (it.qty / r) * it.gluc;
    lip  += (it.qty / r) * it.lip;
  });
  return { cal: Math.round(cal), prot: Math.round(prot), gluc: Math.round(gluc), lip: Math.round(lip) };
}

function itemsHtml(items) {
  return items.map(it => {
    if (it.supplement) return `<div class="item-row"><span class="item-name">${it.name}</span><span class="tag-suppl">💊 suppl.</span></div>`;
    const r = it.ref || 100;
    const cal = Math.round((it.qty / r) * it.cal);
    const unitLabel = it.unit === 'pièce' || it.unit === 'pièces' || it.unit === 'c.à.s.'
      ? `${it.qty} ${it.unit}` : `${it.qty}g`;
    return `<div class="item-row">
      <span class="item-name">${it.name}</span>
      <span class="item-qty">${unitLabel}</span>
      <span class="item-cal">${cal} kcal</span>
    </div>`;
  }).join('');
}

function renderPlan(id) {
  const plan = plans[id];
  if (!plan) return;
  let totCal=0, totProt=0, totGluc=0, totLip=0;
  let html = '';

  plan.meals.forEach(meal => {
    let allItems = [];
    let bodyHtml = '';

    if (meal.subGroups && meal.subGroups.length > 0) {
      meal.subGroups.forEach(sg => {
        allItems = allItems.concat(sg.items);
        bodyHtml += `<div class="subgroup-title">— ${sg.label}</div>${itemsHtml(sg.items)}`;
      });
    } else {
      allItems = meal.items || [];
      bodyHtml = itemsHtml(allItems);
    }

    const m = calcMacros(allItems);
    if (meal.id !== 'tr') { totCal+=m.cal; totProt+=m.prot; totGluc+=m.gluc; totLip+=m.lip; }

    html += `<div class="meal-card" style="border-color:${meal.border};background:${meal.color}">
      <div class="meal-header" style="color:${meal.accent}">
        <span class="meal-name">${meal.name}</span>
        <span class="meal-time">${meal.time}</span>
      </div>
      ${m.cal > 0 ? `<div class="meal-macros-bar" style="color:${meal.accent};background:${meal.color}">
        <span>🔥 <b>${m.cal}</b> kcal</span>
        <span>🥩 <b>${m.prot}g</b> prot</span>
        <span>🌾 <b>${m.gluc}g</b> gluc</span>
        <span>🥑 <b>${m.lip}g</b> lip</span>
      </div>` : ''}
      <div class="meal-items">${bodyHtml}</div>
    </div>`;
  });

  html = `<div class="card" style="background:linear-gradient(135deg,var(--pink-l),#fff);border-color:var(--border)">
    <div style="text-align:center">
      <div style="font-family:Nunito,sans-serif;font-weight:800;font-size:1rem;color:var(--pink-d);margin-bottom:6px">${plan.emoji} ${plan.label} — Total journée</div>
      <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:.85rem;font-weight:700">
        <span>🔥 <b style="color:var(--pink-d)">${fmt(totCal)}</b> kcal</span>
        <span>🥩 <b>${fmt(totProt)}g</b></span>
        <span>🌾 <b>${fmt(totGluc)}g</b></span>
        <span>🥑 <b>${fmt(totLip)}g</b></span>
      </div>
    </div>
  </div>` + html;

  document.getElementById('plan-content').innerHTML = html;
}

// ═══════════════════ SUIVI ═══════════════════════════════════════════════
function loadDayForm() {
  const d = document.getElementById('suivi-date').value;
  const day = suivi[d] || {};
  document.getElementById('suivi-cal').value = day.cal != null ? day.cal : '';
  document.getElementById('suivi-comment-diet').value  = day.commentDiet  || '';
  document.getElementById('suivi-comment-train').value = day.commentTraining || '';
  dietState  = day.diet  || null;
  trainState = day.training || null;
  refreshToggles();
  highlightCal();
}

function refreshToggles() {
  document.getElementById('btn-diet-ok').className  = 'toggle-btn' + (dietState==='ok'?' ok':'');
  document.getElementById('btn-diet-ko').className  = 'toggle-btn' + (dietState==='ko'?' ko':'');
  document.getElementById('btn-train-ok').className = 'toggle-btn' + (trainState==='ok'?' ok':'');
  document.getElementById('btn-train-ko').className = 'toggle-btn' + (trainState==='ko'?' ko':'');
}

function toggleDiet(v)  { dietState  = dietState===v ? null : v; refreshToggles(); }
function toggleTrain(v) { trainState = trainState===v ? null : v; refreshToggles(); }

function changeDay(n) {
  const d = new Date(document.getElementById('suivi-date').value + 'T12:00:00');
  d.setDate(d.getDate() + n);
  document.getElementById('suivi-date').value = d.toISOString().slice(0,10);
  loadDayForm();
}

async function saveDay() {
  const d = document.getElementById('suivi-date').value;
  const cal = document.getElementById('suivi-cal').value;
  const btn = document.querySelector('#tab-suivi .btn-save');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  const dayData = {
    cal: cal !== '' ? Number(cal) : null,
    diet: dietState, training: trainState,
    commentDiet:  document.getElementById('suivi-comment-diet').value,
    commentTraining: document.getElementById('suivi-comment-train').value
  };
  const r = await apiPost({ action:'saveDayData', dateKey:d, dayData });
  if (r.ok) {
    suivi[d] = dayData;
    renderCalendar(); updateStats();
    toast('✅ Journée enregistrée !');
  } else toast('❌ Erreur : ' + (r.error||'inconnue'));
  btn.disabled = false; btn.textContent = '💾 Enregistrer';
}

// ── CALENDAR ─────────────────────────────────────────────────────────────
function renderCalendar() {
  const months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('cal-title').textContent = months[calMonth] + ' ' + calYear;
  const days = ['L','M','M','J','V','S','D'];
  const td = today();
  let html = days.map(d => `<div class="cal-day-label">${d}</div>`).join('');
  const first = new Date(calYear, calMonth, 1).getDay();
  const offset = (first + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  for (let i = 0; i < offset; i++) html += `<div class="cal-day empty"></div>`;
  const selDate = document.getElementById('suivi-date').value;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const data = suivi[key];
    let cls = 'cal-day';
    if (key === td) cls += ' today';
    if (key === selDate) cls += ' selected';
    if (data) {
      cls += ' has-data';
      const dk = (data.diet==='ok'?'ok':'ko') + '-' + (data.training==='ok'?'ok':'ko');
      cls += ' ' + dk;
    }
    html += `<div class="${cls}" onclick="selectDay('${key}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function selectDay(key) {
  document.getElementById('suivi-date').value = key;
  const d = new Date(key + 'T12:00:00');
  calYear = d.getFullYear(); calMonth = d.getMonth();
  loadDayForm(); renderCalendar();
}
function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function highlightCal() { renderCalendar(); }

// ── STATS ────────────────────────────────────────────────────────────────
function updateStats() {
  const all = Object.values(suivi).filter(d => d && d.diet && d.training);
  const okOk = all.filter(d => d.diet==='ok' && d.training==='ok').length;
  const withCal = all.filter(d => d.cal != null && d.cal > 0);
  const avg = withCal.length ? Math.round(withCal.reduce((a,d)=>a+d.cal,0)/withCal.length) : null;

  // Streak (jours consécutifs ok/ok depuis aujourd'hui en remontant)
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    const key = d.toISOString().slice(0,10);
    const day = suivi[key];
    if (day && day.diet==='ok' && day.training==='ok') { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  document.getElementById('stat-ok').textContent     = okOk;
  document.getElementById('stat-streak').textContent = streak;
  document.getElementById('stat-avg').textContent    = avg ? avg : '–';
}

// ═══════════════════ MENSURATIONS ════════════════════════════════════════
function renderMensurations() {
  const tbody = document.getElementById('mens-body');
  if (!mensurations.length) { tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:20px">Aucune mesure enregistrée</td></tr>'; return; }
  const sorted = [...mensurations].sort((a,b) => b.id - a.id);
  tbody.innerHTML = sorted.map(m => `<tr>
    <td><b>${m.date}</b></td>
    <td>${m.poids || '–'}</td>
    <td>${m.poitrine || '–'}</td>
    <td>${m.taille || '–'}</td>
    <td>${m.nombril || '–'}</td>
    <td>${m.fesses || '–'}</td>
    <td>${m.cuisseD || '–'}</td>
    <td>${m.cuisseG || '–'}</td>
    <td>${m.genouD || '–'}</td>
    <td>${m.genouG || '–'}</td>
    <td><button class="btn-del" onclick="deleteMens(${m.id})">🗑</button></td>
  </tr>`).join('');
}

async function saveMens() {
  const date = document.getElementById('mens-date').value;
  if (!date) { toast('⚠️ Sélectionne une date'); return; }
  const btn = document.querySelector('#tab-mensurations .btn-save');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  const newId = mensurations.length > 0 ? Math.max(...mensurations.map(m=>m.id)) + 1 : 1;
  const d = new Date(date);
  const dateStr = d.toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'});
  const record = {
    id: newId,
    date: dateStr,
    poids:    document.getElementById('m-poids').value    || null,
    poitrine: document.getElementById('m-poitrine').value || null,
    taille:   document.getElementById('m-taille').value   || null,
    nombril:  document.getElementById('m-nombril').value  || null,
    fesses:   document.getElementById('m-fesses').value   || null,
    cuisseD:  document.getElementById('m-cuisseD').value  || null,
    cuisseG:  document.getElementById('m-cuisseG').value  || null,
    genouD:   document.getElementById('m-genouD').value   || null,
    genouG:   document.getElementById('m-genouG').value   || null,
  };
  const r = await apiPost({ action:'saveMensuration', record });
  if (r.ok) {
    mensurations.push(record);
    renderMensurations();
    ['poids','poitrine','taille','nombril','fesses','cuisseD','cuisseG','genouD','genouG']
      .forEach(f => document.getElementById('m-' + f).value = '');
    toast('✅ Mesure enregistrée !');
  } else toast('❌ Erreur : ' + (r.error||'inconnue'));
  btn.disabled = false; btn.textContent = '💾 Enregistrer';
}

async function deleteMens(id) {
  if (!confirm('Supprimer cette mesure ?')) return;
  const r = await apiPost({ action:'deleteMensuration', id });
  if (r.ok) {
    mensurations = mensurations.filter(m => m.id !== id);
    renderMensurations();
    toast('🗑 Mesure supprimée');
  } else toast('❌ Erreur');
}
</script>
